services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    network_mode: host
    command: >
      tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN}

  nginx:
    image: nginx:alpine
    container_name: nginx-reverse-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      - debug-agent
      - deploy-agent
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - debug_net

  debug-agent:
    build:
      context: ./debug-agent
    container_name: debug-agent
    restart: unless-stopped
    environment:
      DEBUG_AGENT_ROOT: /host
      DEBUG_AGENT_LISTEN_HOST: 0.0.0.0
      DEBUG_AGENT_LISTEN_PORT: 8080
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - debug_net

  deploy-agent:
    build:
      context: ./deploy-agent
    container_name: deploy-agent
    restart: unless-stopped
    environment:
      DEPLOY_AGENT_LISTEN_HOST: 0.0.0.0
      DEPLOY_AGENT_LISTEN_PORT: 8090
      DEPLOY_AGENT_WORKSPACE_ROOT: /workspace
      DEPLOY_AGENT_TOKEN: ${DEPLOY_AGENT_TOKEN}
      DEPLOY_AGENT_DEFAULT_TIMEOUT: 30
      DEPLOY_AGENT_MAX_TIMEOUT: 180
    volumes:
      - ${HOST_HOME_DIR}:/workspace:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw
    networks:
      - debug_net

networks:
  debug_net:
    driver: bridge
